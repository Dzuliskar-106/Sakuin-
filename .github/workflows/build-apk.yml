name: Build Sakuin Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add & Sync Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generate Android Launcher Icons from SVG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          for size_dir in "48:mipmap-mdpi" "72:mipmap-hdpi" "96:mipmap-xhdpi" "144:mipmap-xxhdpi" "192:mipmap-xxxhdpi"; do
            size="${size_dir%%:*}"
            dir="${size_dir##*:}"
            mkdir -p "android/app/src/main/res/$dir"
            rsvg-convert -w "$size" -h "$size" www/icon.svg -o "android/app/src/main/res/$dir/ic_launcher.png"
            cp "android/app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/ic_launcher_round.png"
            cp "android/app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/ic_launcher_foreground.png"
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sakuin-v1.0-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
